<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/BENCHMARKstyle.css" />
    <title>U1-W4-BW1-TEAM7(BenchMarkPage)</title>
  </head>
  <body>
    <header>
      <div id="logoContainer">
        <img src="./assets/img/epicode_logo.png" alt="epicode-logo" />
      </div>
      <div id="colorChanging"></div>
      <div id="benchmarkTimerContainer">
        <div id="benchmarkTimer" class="benchmarkTimer">
          <span>SECONDS</span>
          <span id="seconds"></span>
          <span>REMAINING</span>
        </div>
      </div>
    </header>

    <main>
      <h1 id="questionH1"></h1>
      <div id="containerOfBenchmarkButtonsContainer">
        <section id="formContainer">
          <form id="formid">
            <p>Please select the difficulty you want to try:</p>
              <input type="radio" id="easyDiff" name="difficulty" value="easy" />   <label for="easyDiff">EASY</label><br />
              <input type="radio" id="mediumDiff" name="difficulty" value="medium" />   <label for="mediumDiff">MEDIUM</label><br />
              <input type="radio" id="hardDiff" name="difficulty" value="hard" />   <label for="hardDiff">HARD</label>

            <p>Please choose how many questions you want to answer:</p>
            <label for="numbOfQuestions"> Da 1 a 30</label>
            <input id="numbOfQuestions" type="number" min="1" max="30" />

            <button type="submit" id="startGameButton">START THE TEST</button>
          </form>
        </section>
      </div>
    </main>
    <footer>
      <h5 id="questionCounter">QUESTION X <span>/ 10</span></h5>
      <button class="benchmarkAnswerButton" id="nextQuestionButton">NEXT QUESTION</button>
    </footer>
    <script type="module" src="./assets/JavaScript/script.js"></script>
  </body>
</html>
